name: FarmSense AI CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: farmsense
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml
      env:
        DB_URL: jdbc:postgresql://localhost:5432/farmsense
        DB_USER: root
        DB_PASS: root
        JWT_SECRET: testing_jwt_secret_must_be_long_enough

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    - name: Run Playwright Tests
      working-directory: ./frontend
      run: |
        npx playwright install --with-deps
        npx playwright test

    - name: Build and Push Docker Images
      if: github.event_name == 'push'
      run: |
        echo "Docker Build step would execute here"
        # docker-compose build
        # docker-compose push
