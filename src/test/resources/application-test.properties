# Test profile overrides for CI/local tests
# Provide a secure-enough JWT secret for HS256 (>= 32 bytes)
jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef
jwt.expiration=604800000
# In-memory H2 for unit and integration tests
spring.datasource.url=jdbc:h2:mem:farmsense_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.com.farmsense=WARN
