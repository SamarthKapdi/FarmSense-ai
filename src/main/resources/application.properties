# ═══════════════════════════════════════════════════════════
# FarmSense AI — Application Configuration
# ═══════════════════════════════════════════════════════════

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# 🚀 Enable Java 21+ Virtual Threads (Project Loom) for Massive Scalability
spring.threads.virtual.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/farmsense
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring AI - Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3
spring.ai.ollama.chat.options.temperature=0.7

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# JWT
jwt.secret=FarmSenseAI2026SuperSecretKeyForJWTTokenGenerationMustBe256BitsLong
jwt.expiration=604800000


# LibreTranslate (optional)
libretranslate.api.url=http://localhost:5000/translate

# Logging
logging.level.com.farmsense=DEBUG
