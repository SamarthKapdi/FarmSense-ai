# ═══════════════════════════════════════════════════════════
# FarmSense AI — Shared Configuration
# ═══════════════════════════════════════════════════════════

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Virtual Threads (Java 21+)
spring.threads.virtual.enabled=true

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/farmsense}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring AI - Ollama
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.model=llama3:latest
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.keep-alive=15m
spring.ai.ollama.vision.model=${OLLAMA_VISION_MODEL:llava:7b}
spring.ai.ollama.init.pull-model-strategy=never

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# JWT — MUST be set via environment variable
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:604800000}

# LibreTranslate (optional)
libretranslate.api.url=${LIBRETRANSLATE_URL:http://localhost:5000/translate}

# Logging
logging.level.com.farmsense=INFO

# Caching
spring.cache.type=simple

# Flyway baseline
spring.flyway.baseline-on-migrate=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Default active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
