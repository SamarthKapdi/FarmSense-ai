# ═══════════════════════════════════════════════════════════
# FarmSense AI — PROD Profile (ALL secrets from env vars)
# ═══════════════════════════════════════════════════════════

# Render dynamically assigns a port
server.port=${PORT:8080}

# EXTREME STARTUP OPTIMIZATION: Lazy initialization defers bean creation until first use.
# This prevents Tomcat from waiting for ALL controllers/services/repos to initialize before binding to PORT.
spring.main.lazy-initialization=true

# BACKGROUND FLYWAY: Prevents Flyway from blocking Tomcat startup
spring.flyway.enabled=true
spring.flyway.async=true

# HIKARI POOL OPTIMIZATION: Minimal pool size for 512MB RAM & Neon serverless bounds
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA / HIBERNATE OPTIMIZATION: Disable Open-in-View to save memory/threads
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ACTUATOR HEALTH CHECK FOR RENDER
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Hosted AI defaults
app.ai.gemini-model=${GEMINI_MODEL:gemini-1.5-flash}
app.ai.groq-model=${GROQ_MODEL:llama-3.1-8b-instant}

# API keys are injected externally
GEMINI_API_KEY=${GEMINI_API_KEY:}
GROQ_API_KEY=${GROQ_API_KEY:}

# JWT — REQUIRED env var, no fallback
jwt.secret=${JWT_SECRET}

# Weather — REQUIRED env var
farmsense.weather.api-key=${WEATHER_API_KEY}

# Production DB — REQUIRED env vars
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# CORS for Production Vercel Frontend
cors.allowed-origins=${FRONTEND_URL:https://farm-sense-ai.vercel.app,https://*.vercel.app,http://localhost:3000}

# Production logging (silence framework, but keep AI pipeline visible)
logging.level.com.farmsense=WARN
logging.level.com.farmsense.service.DiseaseDetectionService=INFO
logging.level.com.farmsense.service.KrishiGPTService=INFO
logging.level.com.farmsense.controller.DetectionController=INFO
logging.level.com.farmsense.controller.ChatController=INFO
logging.level.com.farmsense.config.SpringAIConfig=INFO
logging.level.com.farmsense.config.LoggingFilter=INFO
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR
