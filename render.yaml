services:
  - type: web
    name: farmsense-ai-backend
    env: docker
    plan: free
    healthCheckPath: /api/farm/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEATHER_API_KEY
        sync: false
      - key: OLLAMA_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
